    <div class="process-container">

            <div class="process-circle">
                1

            <p>

        </div>

        <div class="process-step">

            <div class="process-circle">
                2
            </div>

            <p>
                Give in seconds through an encrypted, PCI-

        </div>


        <!-- STEP 3 -->
        <div class="process-step">

            <div class="process-circle">
                3

        </div>

    </div>
